<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">Recursos do MeuVerso</title><desc id="desc">Três cartões ilustram o verso do dia, a busca por versículos e os favoritos.</desc>
<rect width="1200" height="460" rx="28" fill="#f8f6ef"/><text x="600" y="65" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#244b3a">Sua leitura, do seu jeito</text>
<g font-family="Arial,sans-serif">
<g transform="translate(65 105)"><rect width="330" height="290" rx="24" fill="#e8efe4"/><circle cx="55" cy="55" r="29" fill="#d1e0cf"/><path d="M43 43 Q55 35 67 43 V68 Q55 60 43 68Z M67 43 Q79 35 91 43 V68 Q79 60 67 68Z" fill="#4d7457"/><text x="28" y="120" font-size="23" font-weight="700" fill="#244b3a">Verso do dia</text><text x="28" y="160" font-size="17" fill="#385b47"><tspan x="28" dy="0">Encontre uma mensagem</tspan><tspan x="28" dy="25">para refletir e levar com</tspan><tspan x="28" dy="25">você ao longo do dia.</tspan></text><rect x="28" y="235" width="150" height="34" rx="17" fill="#315f4d"/><text x="103" y="257" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">LER E REFLETIR</text></g>
<g transform="translate(435 105)"><rect width="330" height="290" rx="24" fill="#f0e9d9"/><circle cx="55" cy="55" r="29" fill="#e5d8bd"/><circle cx="51" cy="51" r="12" fill="none" stroke="#806b45" stroke-width="4"/><path d="M60 60 L72 72" stroke="#806b45" stroke-width="4" stroke-linecap="round"/><text x="28" y="120" font-size="23" font-weight="700" fill="#5a4c32">Explore</text><text x="28" y="160" font-size="17" fill="#6b5a3b"><tspan x="28" dy="0">Busque versículos por</tspan><tspan x="28" dy="25">palavra ou referência e</tspan><tspan x="28" dy="25">descubra novas leituras.</tspan></text><rect x="28" y="235" width="150" height="34" rx="17" fill="#7b6843"/><text x="103" y="257" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">ENCONTRAR</text></g>
<g transform="translate(805 105)"><rect width="330" height="290" rx="24" fill="#e8e9f0"/><circle cx="55" cy="55" r="29" fill="#d8d9e8"/><path d="M55 75 L34 54 C20 35 44 25 55 42 C66 25 90 35 76 54Z" fill="#656b9b"/><text x="28" y="120" font-size="23" font-weight="700" fill="#363d68">Favoritos</text><text x="28" y="160" font-size="17" fill="#4d527c"><tspan x="28" dy="0">Guarde os versículos</tspan><tspan x="28" dy="25">especiais para revisitá-los</tspan><tspan x="28" dy="25">quando quiser.</tspan></text><rect x="28" y="235" width="150" height="34" rx="17" fill="#656b9b"/><text x="103" y="257" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">VER SALVOS</text></g>
</g></svg>
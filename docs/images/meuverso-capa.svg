<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">MeuVerso — um verso para acompanhar seu dia</title><desc id="desc">Ilustração editorial em tons creme e verde, com um celular exibindo um versículo bíblico.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f5ed"/><stop offset="1" stop-color="#e5eee4"/></linearGradient><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#183d31" flood-opacity=".16"/></filter></defs>
<rect width="1200" height="560" rx="34" fill="url(#bg)"/><circle cx="1040" cy="75" r="130" fill="#d7e6d6" opacity=".65"/><circle cx="115" cy="500" r="180" fill="#e7dfcc" opacity=".7"/>
<g font-family="Inter,Arial,sans-serif" fill="#203d32"><text x="92" y="160" font-size="22" font-weight="700" letter-spacing="5">PAUSA • LEITURA • FÉ</text><text x="88" y="245" font-size="66" font-weight="750">MeuVerso</text><text x="92" y="298" font-size="26">Um verso da Bíblia para</text><text x="92" y="334" font-size="26">acompanhar o seu dia.</text><rect x="92" y="380" width="222" height="52" rx="26" fill="#315f4d"/><text x="203" y="413" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">LEVE SUA FÉ COM VOCÊ</text></g>
<g transform="translate(750 38) rotate(5 160 240)" filter="url(#shadow)"><rect x="0" y="0" width="310" height="480" rx="42" fill="#253c32"/><rect x="11" y="11" width="288" height="458" rx="34" fill="#fbfaf6"/><rect x="105" y="19" width="100" height="17" rx="9" fill="#253c32"/><text x="32" y="70" font-family="Arial,sans-serif" font-size="13" fill="#789080">SEU MOMENTO DE PAZ</text><text x="32" y="104" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#234c3b">Verso do dia</text><rect x="27" y="127" width="256" height="218" rx="24" fill="#edf2e8"/><text x="48" y="166" font-family="Georgia,serif" font-size="43" fill="#64816b">“</text><text x="48" y="204" font-family="Georgia,serif" font-size="19" fill="#284b3a"><tspan x="48" dy="0">O Senhor é o meu</tspan><tspan x="48" dy="29">pastor; nada me</tspan><tspan x="48" dy="29">faltará.</tspan></text><text x="48" y="310" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#55735e">SALMOS 23:1</text><circle cx="63" cy="385" r="21" fill="#e5eee2"/><path d="M63 394 C40 380 49 365 63 377 C77 365 86 380 63 394Z" fill="#52785c"/><rect x="98" y="370" width="160" height="30" rx="15" fill="#315f4d"/><text x="178" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">GUARDAR VERSO</text><text x="155" y="438" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#809087">Hoje • Respire • Confie</text></g>
</svg>